servers:
  webresearch:
    command: npx
    args:
    - -y
    - '@mzxrai/mcp-webresearch@latest'
    read_timeout_seconds: 120
  firecrawl:
    # Keep tool schemas deterministic across hosts and cron runs.
    command: npx
    args:
    - -y
    - firecrawl-mcp@3.23.6
    env:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
  # Korean market data is served exclusively by the repository KIS adapter.
  # kospi_kosdaq is a stable tool namespace, not an exchange-login dependency.
  #
  # command: 이 서버는 리포 코드를 import 하므로 **리포 의존성이 설치된 인터프리터**
  # 여야 한다. 맨 `python3` 는 호스트마다 다른 것을 가리킨다 — 맥미니에서는
  # Homebrew 3.14 라서 `mcp` 조차 없다. 오케스트레이터를 띄우는 것과 같은 파이썬을
  # PRISM_MCP_PYTHON 으로 지정한다.
  kospi_kosdaq:
    command: ${PRISM_MCP_PYTHON:-python3}
    args:
    - -m
    - cores.market_data.mcp_server
    env:
      # 레지스트리가 env 를 명시적으로 넘기므로 리포 루트를 직접 준다.
      # 기본값 '.' 는 자식의 cwd(오케스트레이터가 리포 루트에서 실행)를 가리킨다.
      PYTHONPATH: ${PRISM_REPO_ROOT:-.}
      PRISM_REPORT_DATA_SOURCES: ${PRISM_REPORT_DATA_SOURCES:-kis}
    read_timeout_seconds: 45
  perplexity:
    # Official Perplexity MCP server. Pin the package so tool schemas cannot
    # drift between cron runs or hosts.
    command: npx
    args:
    - -y
    - '@perplexity-ai/mcp-server@1.2.0'
    env:
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
    read_timeout_seconds: 75
  sqlite:
    command: uv
    args:
    - --directory
    - sqlite
    - run
    - mcp-server-sqlite
    - --db-path
    - ../stock_tracking_db.sqlite
  time:
    # The external mcp-server-time package broke against newer mcp releases
    # (McpError -> MCPError). Keep this deterministic and in-repo instead.
    command: ${PRISM_MCP_PYTHON:-python3}
    args:
    - -m
    - cores.llm.time_mcp_server
    env:
      PYTHONPATH: ${PRISM_REPO_ROOT:-.}
    read_timeout_seconds: 10
  deepsearch:
    command: npx
    args:
    - -y
    - mcp-remote
    - http://localhost:8000/sse
    read_timeout_seconds: 120
  yahoo_finance:
    command: uv
    args:
    - tool
    - run
    - --from
    - yahoo-finance-mcp==0.1.2
    - --with
    - mcp==1.26.0
    - yahoo-finance-mcp
    # yahoo-finance-mcp's FastMCP settings auto-read .env from cwd.  Running
    # outside the repo prevents an unrelated protected .env from aborting it.
    cwd: ${PRISM_MCP_WORKDIR:-/tmp}
    read_timeout_seconds: 45
