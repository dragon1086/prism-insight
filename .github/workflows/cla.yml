name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# The pinned action does not check out or execute code from an untrusted PR.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    if: ${{ github.repository == 'dragon1086/prism-insight' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check contributor agreement
        if: |
          (
            github.event_name == 'pull_request_target' &&
            (
              github.event.action == 'opened' ||
              github.event.action == 'synchronize' ||
              (github.event.action == 'closed' && github.event.pull_request.merged == true)
            )
          ) ||
          (
            github.event_name == 'issue_comment' &&
            (
              github.event.comment.body == 'recheck' ||
              github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
            )
          )
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/dragon1086/prism-insight/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dragon1086,cokac-bot,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before this pull request can be
            merged, each contributor must read the
            [authoritative English CLA](https://github.com/dragon1086/prism-insight/blob/main/CLA.md)
            or its [Korean translation](https://github.com/dragon1086/prism-insight/blob/main/CLA_ko.md),
            then comment the exact signature statement shown below.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
          create-file-commit-message: Create the PRISM-INSIGHT CLA signature ledger
          signed-commit-message: $contributorName signed CLA v1.0 for $owner/$repo#$pullRequestNo
          lock-pullrequest-aftermerge: true
