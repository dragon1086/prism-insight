name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license-compliance:
    name: Third-party license compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Check third-party copyleft licenses
        run: python tools/license_compliance.py

      # Reuse the production dependency environment for runtime import parity.
      # KR/US packages intentionally shadow one another: separate pytest processes.
      - name: Install existing test runners
        run: python -m pip install pytest pytest-asyncio

      - name: Offline BUY runtime safety regression
        env:
          PRISM_DISABLE_SIGNAL_PUBLISH: "1"
        run: |
          python -m pytest tests/test_trading_scenario_contract.py \
            tests/test_trading_agents_prompt_rules.py \
            tests/test_codex_oauth_fast_backend.py tests/test_buy_codex_settings.py \
            tests/test_codex_fast_process_cleanup.py tests/test_codex_fast_large_stdin.py \
            tests/test_codex_fast_stage_telemetry.py tests/test_entry_score_policy_contract.py \
            tests/test_regime_min_score_floor.py tests/test_buy_gate.py \
            tests/test_order_budget.py tests/test_pyramid_pilot_exclusion.py -q
          python -m pytest tests/test_trend_quality_research.py \
            tests/test_trend_research_capture.py tests/test_strategy_ledger.py tests/test_strategy_ledger_slots.py \
            tests/test_pilot_lifecycle.py tests/test_strategy_ledger_outbox.py \
            tests/test_strategy_ledger_test_delivery.py \
            tests/test_strategy_ledger_projection.py tests/test_strategy_ledger_messages.py \
            tests/test_trading_context.py tests/test_entry_quality_evidence_packet.py -q
          python -m pytest tests/test_historical_closed_record_evidence.py \
            tests/test_historical_trend_noise_replay.py tests/test_trend_replay_data_collection.py \
            tests/test_kr_legacy_adx_research.py tests/test_kr_legacy_adx_identity_v2.py \
            tests/test_kr_legacy_adx_calendar_v3.py -q
          # Existing bootstrap creates only a fake example.com KIS config, removes it at exit.
          python -m pytest tests/test_multi_account_domestic.py \
            tests/test_astra_kr_safety.py tests/test_kr_buy_quote_validation.py \
            tests/test_parallel_trading_batch.py tests/test_trading_scenario_retry.py \
            tests/test_stock_tracking_agent_process_reports.py tests/test_kr_pending_entry.py \
            tests/test_kr_order_budget.py -q
          python -m pytest prism-us/tests/test_us_buy_runtime_safety.py \
            prism-us/tests/test_us_parallel_trading_analysis.py \
            prism-us/tests/test_us_stock_tracking_agent_process_reports.py \
            prism-us/tests/test_trading_agents_prompt_rules.py \
            prism-us/tests/test_us_order_budget.py -q

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: examples/dashboard
        run: npm ci --legacy-peer-deps

      - name: Build dashboard
        working-directory: examples/dashboard
        run: npm run build

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            pydantic \
            pyyaml \
            "openai>=2.9,<3" \
            "openai-agents==0.7.0" \
            mcp \
            tenacity \
            pytest \
            pytest-asyncio \
            "pandas~=2.2.3"

      - name: Run tests
        run: |
          python -m pytest cores/llm/tests/ -q
          python -m pytest --noconftest tests/test_buy_codex_settings.py \
            tests/test_trading_scenario_contract.py tests/test_codex_oauth_fast_backend.py \
            tests/test_codex_fast_process_cleanup.py tests/test_codex_fast_stage_telemetry.py \
            tests/test_entry_quality_evidence_packet.py -q
          # Lightweight real-order boundary gates. Keep KR/US fill-chaser in
          # separate processes because their runtime packages intentionally
          # shadow one another.
          python -m pytest tests/test_execution_service.py -q \
            -k "not transient_empty_portfolio"
          python -m pytest --noconftest \
            tests/test_order_intents.py \
            tests/test_positions.py -q
          python -m pytest --noconftest \
            tests/test_report_agent_contract.py \
            tests/test_report_generation_backend.py \
            tests/test_report_generator_contract.py \
            tests/test_telegram_report_backend.py -q
          python -m pytest \
            tests/test_issue_288_pyramiding.py \
            tests/test_layer2_stale_snapshot_guard.py -q
          python -m pytest tests/test_sell_claim_concurrency.py -q
          python -m pytest tests/test_fill_chaser.py -q
          python -m pytest --noconftest prism-us/tests/test_fill_chaser_us.py -q
          # Non-scalp execution safety: fake brokers and isolated SQLite only.
          python tools/run_btc_safety_tests.py \
            prism-btc/tests/test_demo.py \
            prism-btc/tests/test_native_stop.py \
            prism-btc/tests/test_take_profit.py \
            prism-btc/tests/test_protection_reconcile.py \
            prism-btc/tests/test_swing.py \
            prism-btc/tests/test_swing_capital.py \
            prism-btc/tests/test_live_runner.py \
            prism-btc/tests/test_runner_recovery.py \
            prism-btc/tests/test_broker_recovery.py \
            prism-btc/tests/test_closed_entry_recovery.py \
            prism-btc/tests/test_order_retirement.py \
            prism-btc/tests/test_entry_reservations.py \
            prism-btc/tests/test_shared_entry_coordinator.py \
            prism-btc/tests/test_shared_entry_policy.py \
            prism-btc/tests/test_policy_observation.py \
            prism-btc/tests/test_confidence_allocation.py \
            prism-btc/tests/test_allocation_hooks.py \
            prism-btc/tests/test_confidence_allocation_study.py \
            prism-btc/tests/test_split_entry.py \
            prism-btc/tests/test_split_entry_study.py \
            prism-btc/tests/test_intrabar_broker.py \
            prism-btc/tests/test_intrabar_inputs.py \
            prism-btc/tests/test_market_regimes.py \
            prism-btc/tests/test_native_intrabar_strategy.py \
            prism-btc/tests/test_intrabar_revalidation.py \
            prism-btc/tests/test_intrabar_evidence.py \
            prism-btc/tests/test_swing_entry_recovery.py
          # Pure offline scalp policy only; no exchange client, DB, or live loop.
          PYTHONPATH=prism-btc python -m pytest --noconftest \
            prism-btc/tests/test_scalp.py \
            prism-btc/tests/test_execution_replay.py \
            prism-btc/tests/test_replay_data.py \
            prism-btc/tests/test_scalp_replay_benchmark.py \
            prism-btc/tests/test_portfolio_replay.py \
            prism-btc/tests/test_strategy_mixture.py \
            prism-btc/tests/test_mixture_statistics.py \
            prism-btc/tests/test_adaptive_signals.py \
            prism-btc/tests/test_adaptive_replay.py \
            prism-btc/tests/test_adaptive_retest.py \
            prism-btc/tests/test_transition_signals.py \
            prism-btc/tests/test_transition_replay.py \
            prism-btc/tests/test_transition_retest.py \
            prism-btc/tests/test_entry_latency_diagnostic.py \
            prism-btc/tests/test_entry_latency_runner.py -q
