name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            pydantic \
            pyyaml \
            "openai>=2.9,<3" \
            "openai-agents==0.7.0" \
            mcp \
            tenacity \
            pytest \
            pytest-asyncio

      - name: Compile runtime safety foundation and thin application services
        run: >-
          python -m compileall -q
          prism_core
          prism_app
          stock_analysis_orchestrator.py
          prism-us/us_stock_analysis_orchestrator.py
          tools/audit_broker_boundaries.py

      - name: Audit broker boundaries
        run: python tools/audit_broker_boundaries.py

      - name: Run runtime safety tests
        run: |
          python -m pytest tests/runtime tests/safety -q
          # This always-run guard detects accidental removal of the dedicated
          # E2E matrix step below.
          python -m pytest \
            tests/e2e/test_phase1_no_external_effects.py::test_phase1_end_to_end_acceptance_is_fail_closed_in_every_ci_matrix_job \
            -q

      - name: Run storage migration tests
        run: python -m pytest tests/storage -q

      - name: Run internal paper broker tests
        run: python -m pytest tests/paper -q

      - name: Run Phase 1 end-to-end acceptance tests
        run: python -m pytest tests/e2e -q

      - name: Run append-only proposal and outcome storage tests
        run: python -m pytest tests/feedback -q

      - name: Run thin application service tests
        run: python -m pytest tests/app -q

      - name: Run daily and weekly report read-model tests
        run: python -m pytest tests/reporting -q

      - name: Run fake-by-default Telegram contract tests
        run: python -m pytest tests/telegram -q

      - name: Run local job operations and watchdog tests
        run: python -m pytest tests/ops -q

      - name: Run separated localhost dashboard contract tests
        run: python -m pytest tests/dashboard -q

      - name: Run AgentNews fixture contract tests
        run: python -m pytest tests/data/providers/test_agentnews_provider.py -q

      - name: Run point-in-time data contract and quality-gate tests
        run: python -m pytest tests/data -q

      - name: Run regime quality-policy tests
        run: python -m pytest tests/test_regime_policy.py -q

      - name: Run strategy contract and registry tests
        run: python -m pytest tests/strategies -q

      - name: Run deterministic quant feature tests
        run: python -m pytest tests/features -q

      - name: Run strict LLM proposal contract tests
        run: python -m pytest tests/llm -q

      - name: Run deterministic position and consolidated portfolio policy tests
        run: python -m pytest tests/policy tests/portfolio -q

      - name: Run point-in-time research engine tests
        run: python -m pytest tests/research -q

      - name: Run strategy-specific trade-plan prompt contract tests
        run: python -m pytest tests/agents -q

      - name: Run tests
        run: |
          python -m pytest cores/llm/tests/ -q
          # Lightweight real-order boundary gates. Keep KR/US fill-chaser in
          # separate processes because their runtime packages intentionally
          # shadow one another.
          python -m pytest tests/test_execution_service.py -q \
            -k "not transient_empty_portfolio"
          python -m pytest --noconftest \
            tests/test_order_intents.py \
            tests/test_positions.py -q
          python -m pytest --noconftest \
            tests/test_report_agent_contract.py \
            tests/test_report_generation_backend.py \
            tests/test_report_generator_contract.py \
            tests/test_telegram_report_backend.py -q
          python -m pytest \
            tests/test_issue_288_pyramiding.py \
            tests/test_layer2_stale_snapshot_guard.py -q
          python -m pytest tests/test_sell_claim_concurrency.py -q
          python -m pytest tests/test_fill_chaser.py -q
          python -m pytest --noconftest prism-us/tests/test_fill_chaser_us.py -q
