name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  license-compliance:
    name: Third-party license compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Check third-party copyleft licenses
        run: python tools/license_compliance.py

      # Reuse the production dependency environment for runtime import parity.
      # KR/US packages intentionally shadow one another: separate pytest processes.
      - name: Install existing test runners
        run: python -m pip install pytest pytest-asyncio

      - name: KR/US provider-shape batch integration gate
        env:
          PRISM_DISABLE_SIGNAL_PUBLISH: "1"
        run: python -m pytest tests/test_ohlcv_shape.py tests/test_kr_screening_ohlcv_shape.py tests/test_us_batch_ohlcv_shape_integration.py tests/test_kis_corporate_action_snapshot.py -q

      - name: Offline BUY runtime safety regression
        env:
          PRISM_DISABLE_SIGNAL_PUBLISH: "1"
        run: |
          python -m pytest tests/test_macro_mcp_app.py tests/test_chatgpt_proxy_body_limit.py \
            tests/test_validate_us_full_pipeline.py tests/test_market_report_singleflight.py \
            tests/test_macro_public_sources.py tests/test_runtime_cleanup.py \
            tests/test_nasdaq100_constituents.py tests/test_chatgpt_oauth/ \
            tests/test_market_analysis_source_guard.py -q
          python -m pytest tests/test_report_research_prefetch.py tests/test_report_research_context.py \
            tests/test_research_excerpt_integrity.py tests/test_research_scoped_config.py \
            tests/test_research_scope_boundary.py \
            tests/test_report_input_evidence.py tests/test_news_competitive_evidence_contract.py \
            tests/test_market_intelligence.py tests/test_market_intelligence_wiring.py \
            tests/test_market_report_context.py tests/test_sector_taxonomy_alignment.py \
            tests/test_target_provenance_contract.py tests/test_competitive_evidence_handoff.py \
            tests/test_competitive_prefetch.py tests/test_report_sources_without_tradingview.py \
            tests/test_us_analyst_data_quality.py -q
          python -m pytest tests/test_screening_price_evidence.py tests/test_screening_orchestrator_rr_contract.py tests/test_agent_fit_score_constant_tripwire.py -q
          python -m pytest tests/test_agent_lazy_broker_imports.py -q
          python -m pytest tests/test_us_evidence_pipeline_contract.py \
            tests/test_us_pdf_buy_handoff.py tests/test_us_flow_evidence.py \
            tests/test_us_sec_segment_units.py tests/test_us_report_technical_facts.py \
            tests/test_us_report_consistency.py tests/test_telegram_oauth_bootstrap.py \
            tests/test_us_report_public_quote_inputs.py tests/test_us_report_chart_snapshot.py \
            tests/test_us_official_company_sources.py tests/test_us_official_macro_sources.py \
            tests/test_us_report_public_inputs.py tests/test_report_financial_math.py \
            tests/test_us_price_chart_missing_bars.py tests/test_us_market_official_macro_contract.py -q
          python -m pytest tests/test_dart_*.py tests/test_filing_*.py \
            tests/test_material_filing_selection.py tests/test_kr_official_report_inputs.py \
            tests/test_report_calculations.py tests/test_kr_report_calculation_prefetch.py \
            tests/test_kr_production_report_quality.py tests/test_report_presentation.py \
            tests/test_us_public_technical_presentation.py -q
          python -m pytest tests/test_dart_chapter*.py tests/test_dart_port*.py \
            tests/test_dart_deep_analysis.py tests/test_dart_depth_cache_contract.py \
            tests/test_dart_evaluation_context.py tests/test_kr_dart_pdf_buy_handoff.py \
            tests/test_kr_peer_comparison.py -q
          python -m pytest tests/test_agent_virtual_initialization.py \
            tests/test_agent_instance_mcp_fallback.py tests/test_isolated_agent_runtime.py -q
          python -m pytest tests/test_codex_full_stage.py tests/test_codex_probe_stage.py \
            tests/test_codex_probe_sandbox.py tests/test_codex_trading_runtime_probe.py \
            tests/test_codex_probe_mcp_bridge.py tests/test_isolated_responses_proxy.py -q
          python -m pytest tests/test_trading_scenario_contract.py \
            tests/test_trading_agents_prompt_rules.py \
            tests/test_codex_oauth_fast_backend.py tests/test_buy_codex_settings.py \
            tests/test_codex_fast_process_cleanup.py tests/test_codex_fast_large_stdin.py \
            tests/test_codex_fast_stage_telemetry.py tests/test_entry_score_policy_contract.py \
            tests/test_regime_min_score_floor.py tests/test_buy_gate.py \
            tests/test_order_budget.py tests/test_pyramid_pilot_exclusion.py -q
          python -m pytest tests/test_trend_quality_research.py \
            tests/test_trend_research_capture.py tests/test_strategy_ledger.py tests/test_strategy_ledger_slots.py \
            tests/test_pilot_lifecycle.py tests/test_strategy_ledger_outbox.py \
            tests/test_strategy_ledger_test_delivery.py \
            tests/test_strategy_ledger_projection.py tests/test_strategy_ledger_messages.py \
            tests/test_trading_context.py tests/test_entry_quality_evidence_packet.py -q
          python -m pytest tests/test_historical_closed_record_evidence.py \
            tests/test_historical_trend_noise_replay.py tests/test_trend_replay_data_collection.py \
            tests/test_kr_legacy_adx_research.py tests/test_kr_legacy_adx_identity_v2.py \
            tests/test_kr_legacy_adx_calendar_v3.py -q
          # Existing bootstrap creates only a fake example.com KIS config, removes it at exit.
          python -m pytest tests/test_multi_account_domestic.py \
            tests/test_astra_kr_safety.py tests/test_kr_buy_quote_validation.py \
            tests/test_parallel_trading_batch.py tests/test_trading_scenario_retry.py \
            tests/test_stock_tracking_agent_process_reports.py tests/test_kr_pending_entry.py \
            tests/test_kr_order_budget.py -q
          python -m pytest prism-us/tests/test_us_buy_runtime_safety.py \
            prism-us/tests/test_us_parallel_trading_analysis.py \
            prism-us/tests/test_us_stock_tracking_agent_process_reports.py \
            prism-us/tests/test_trading_agents_prompt_rules.py \
            prism-us/tests/test_us_order_budget.py -q

      - name: Evidence linkage and ambiguous notification safety
        env:
          PRISM_DISABLE_SIGNAL_PUBLISH: "1"
        run: |
          python -m pytest tests/test_evidence_capture_repairs.py \
            tests/test_korean_trading_message.py tests/test_recent_strategy_exit_context.py \
            tests/test_company_evidence_contract.py \
            tests/test_micro_split_batch_linkage.py tests/test_telegram_delivery_safety.py \
            tests/test_telegram_delivery_diagnostics.py \
            tests/test_oneil_watchlist.py tests/test_watchlist_micro_evidence_packet.py tests/test_oneil_feature_status.py \
            tests/test_oneil_watchlist_kr.py tests/test_watchlist_outcomes.py tests/test_kr_shadow_pipeline_hooks.py \
            tests/test_kr_batch_watch_integration.py \
            tests/test_exit_effect_*.py tests/test_micro_split*.py \
            tests/test_third_slot*.py -q

      - name: KIS-only provider and consumer boundary
        env:
          PRISM_DISABLE_SIGNAL_PUBLISH: "1"
        run: |
          python -m pytest tests/test_kis_only_architecture.py \
            tests/test_market_data_failure_alert.py \
            tests/test_kis_snapshot_provenance.py \
            tests/test_kis_sector_namespace.py tests/test_kis_master_volume_precision.py \
            tests/test_kis_hindsight_prices.py \
            tests/test_kis_consumer_boundary.py tests/test_kis_source.py \
            tests/test_kis_current_capabilities.py tests/test_kis_market_snapshot.py \
            tests/test_kis_previous_snapshot.py tests/test_market_data_sources.py \
            tests/test_market_data_preopen_flows.py \
            tests/test_market_data_mcp_server.py tests/test_prefetch_auth_outage.py \
            tests/test_trigger_provider_outage.py -q

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: examples/dashboard
        run: npm ci --legacy-peer-deps

      - name: Build dashboard
        working-directory: examples/dashboard
        run: npm run build

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            pydantic \
            pyyaml \
            "openai>=2.9,<3" \
            "openai-agents==0.7.0" \
            mcp \
            tenacity \
            pytest \
            pytest-asyncio \
            "pandas~=2.2.3"

      - name: Run tests
        run: |
          python -m pytest cores/llm/tests/ -q
          python -m pytest --noconftest tests/test_buy_codex_settings.py \
            tests/test_trading_scenario_contract.py tests/test_codex_oauth_fast_backend.py \
            tests/test_codex_fast_process_cleanup.py tests/test_codex_fast_stage_telemetry.py \
            tests/test_entry_quality_evidence_packet.py -q
          # Lightweight real-order boundary gates. Keep KR/US fill-chaser in
          # separate processes because their runtime packages intentionally
          # shadow one another.
          python -m pytest tests/test_execution_service.py -q \
            -k "not transient_empty_portfolio"
          python -m pytest --noconftest \
            tests/test_order_intents.py \
            tests/test_positions.py -q
          python -m pytest --noconftest \
            tests/test_report_agent_contract.py \
            tests/test_report_generation_backend.py \
            tests/test_report_generator_contract.py \
            tests/test_telegram_report_backend.py -q
          python -m pytest \
            tests/test_issue_288_pyramiding.py \
            tests/test_layer2_stale_snapshot_guard.py -q
          python -m pytest tests/test_sell_claim_concurrency.py -q
          python -m pytest tests/test_fill_chaser.py -q
          python -m pytest --noconftest prism-us/tests/test_fill_chaser_us.py -q
          # Non-scalp execution safety: fake brokers and isolated SQLite only.
          python tools/run_btc_safety_tests.py \
            prism-btc/tests/test_demo.py \
            prism-btc/tests/test_native_stop.py \
            prism-btc/tests/test_take_profit.py \
            prism-btc/tests/test_protection_reconcile.py \
            prism-btc/tests/test_swing.py \
            prism-btc/tests/test_swing_capital.py \
            prism-btc/tests/test_live_runner.py \
            prism-btc/tests/test_runner_recovery.py \
            prism-btc/tests/test_broker_recovery.py \
            prism-btc/tests/test_broker_auth.py \
            prism-btc/tests/test_closed_entry_recovery.py \
            prism-btc/tests/test_order_retirement.py \
            prism-btc/tests/test_entry_reservations.py \
            prism-btc/tests/test_shared_entry_coordinator.py \
            prism-btc/tests/test_liquidation_guard.py \
            prism-btc/tests/test_shared_entry_policy.py \
            prism-btc/tests/test_policy_observation.py \
            prism-btc/tests/test_confidence_allocation.py \
            prism-btc/tests/test_allocation_hooks.py \
            prism-btc/tests/test_confidence_allocation_study.py \
            prism-btc/tests/test_split_entry.py \
            prism-btc/tests/test_split_entry_study.py \
            prism-btc/tests/test_intrabar_broker.py \
            prism-btc/tests/test_intrabar_inputs.py \
            prism-btc/tests/test_market_regimes.py \
            prism-btc/tests/test_native_intrabar_strategy.py \
            prism-btc/tests/test_intrabar_revalidation.py \
            prism-btc/tests/test_intrabar_evidence.py \
            prism-btc/tests/test_swing_entry_recovery.py \
            prism-btc/tests/test_swing_entry_notice.py \
            prism-btc/tests/test_position_snapshot.py \
            prism-btc/tests/test_compact_trade_notices.py \
            prism-btc/tests/test_notifier.py \
            prism-btc/tests/test_exchange_snapshot.py \
            prism-btc/tests/test_ops_alerts.py \
            prism-btc/tests/test_healthcheck.py
          # Pure offline scalp policy only; no exchange client, DB, or live loop.
          PYTHONPATH=prism-btc python -m pytest --noconftest \
            prism-btc/tests/test_scalp.py \
            prism-btc/tests/test_execution_replay.py \
            prism-btc/tests/test_replay_data.py \
            prism-btc/tests/test_scalp_replay_benchmark.py \
            prism-btc/tests/test_portfolio_replay.py \
            prism-btc/tests/test_strategy_mixture.py \
            prism-btc/tests/test_mixture_statistics.py \
            prism-btc/tests/test_adaptive_signals.py \
            prism-btc/tests/test_adaptive_replay.py \
            prism-btc/tests/test_adaptive_retest.py \
            prism-btc/tests/test_transition_signals.py \
            prism-btc/tests/test_transition_replay.py \
            prism-btc/tests/test_transition_retest.py \
            prism-btc/tests/test_entry_latency_diagnostic.py \
            prism-btc/tests/test_entry_latency_runner.py -q
